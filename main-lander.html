        .container {
            max-width: 420px;

            font-weight: 700;
            padding: 4px 14px;
            border-radius: 30px;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 16px;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
        }
        
        .photo-wrapper {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 0 auto 18px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #ff4757;
            box-shadow: 0 0 40px rgba(255,71,87,0.4);
        }
        
        .photo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        .online-dot {
            position: absolute;
            bottom: 8px;
            right: 8px;
            width: 18px;
            height: 18px;
            background: #2ed573;
            border-radius: 50%;
            border: 3px solid #16213e;
            animation: blink 1s infinite;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        
        .name {

            font-weight: 700;
            margin-bottom: 4px;
            letter-spacing: -0.3px;
        }
        
        .name span { color: #ff4757; }
        
        .location {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 6px;
        }
        
        .distance {
            font-size: 13px;
            color: #2ed573;
            font-weight: 600;
            margin-bottom: 16px;
        }
        
        .desc {
            font-size: 15px;
            line-height: 1.6;
            color: #ccc;
            margin-bottom: 20px;
            padding: 0 8px;
        }
        
        .desc strong { color: #fff; }
        
        .stats {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-bottom: 22px;
        }
        
        .stat { text-align: center; }
        
        .stat .num {
            font-size: 20px;
            font-weight: 700;
            color: #ff4757;
        }
        
        .stat .label {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .cta-btn {
            display: block;
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 8px 30px rgba(255,71,87,0.4);
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            animation: glow 2s infinite;
        }
        
        .cta-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(255,71,87,0.6);
        }
        
        @keyframes glow {
            0%, 100% { box-shadow: 0 8px 30px rgba(255,71,87,0.4); }
            50% { box-shadow: 0 8px 50px rgba(255,71,87,0.7); }
        }
        
        .sub-text {

            color: #666;
            margin-top: 4px;

        .sub-text .highlight {
            color: #2ed573;

        .trust {

            gap: 16px;
            margin-top: 18px;
            padding-top: 16px;
            border-top: 1px solid rgba(255,255,255,0.06);
        }
        
        .trust span {
            font-size: 11px;
            color: #555;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .trust span::before {

        }

            .cta-btn { font-size: 16px; padding: 15px; }

        }
    </style>
</head>
