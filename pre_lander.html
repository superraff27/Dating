<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quick Question</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #fff;
        }
        
        .container {
            max-width: 400px;
            width: 100%;
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 32px 24px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 25px 80px rgba(0,0,0,0.6);
            text-align: center;
        }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            margin-bottom: 24px;
            overflow: hidden;
        }
        
        .progress-bar .fill {
            height: 100%;
            width: 33%;
            background: linear-gradient(90deg, #ff4757, #ff6b81);
            border-radius: 10px;
            transition: width 0.4s ease;
        }
        
        .step {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }
        
        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            line-height: 1.3;
        }
        
        .sub {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 28px;
        }
        
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }
        
        .option-btn {
            display: block;
            width: 100%;
            padding: 16px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            text-align: center;
            text-decoration: none;
        }
        
        .option-btn:hover {
            background: rgba(255,71,87,0.2);
            border-color: #ff4757;
            transform: translateY(-2px);
        }
        
        .option-btn.selected {
            background: rgba(255,71,87,0.3);
            border-color: #ff4757;
        }
        
        .next-btn {
            display: none;
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            border: none;
            border-radius: 14px;
            color: #fff;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 30px rgba(255,71,87,0.4);
            letter-spacing: 0.5px;
        }
        
        .next-btn.show {
            display: block;
        }
        
        .next-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(255,71,87,0.6);
        }
        
        .trust {
            margin-top: 20px;
            font-size: 11px;
            color: #555;
        }
        
        .trust span {
            color: #2ed573;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- PROGRESS -->
    <div class="progress-bar">
        <div class="fill" id="progressFill"></div>
    </div>
    
    <div class="step" id="stepLabel">Step 1 of 3</div>
    
    <!-- QUESTION 1: AGE -->
    <div id="question1">
        <h1>Are you 18 or older?</h1>
        <p class="sub">We need to verify your age to continue</p>
        <div class="options">
            <button class="option-btn" onclick="selectOption(1, 'yes')">✅ Yes, I'm 18+</button>
            <button class="option-btn" onclick="selectOption(1, 'no')">❌ No, I'm under 18</button>
        </div>
    </div>
    
    <!-- QUESTION 2: GENDER -->
    <div id="question2" style="display:none;">
        <h1>What are you looking for?</h1>
        <p class="sub">Help us find the perfect match for you</p>
        <div class="options">
            <button class="option-btn" onclick="selectOption(2, 'women')">👩 Women</button>
            <button class="option-btn" onclick="selectOption(2, 'men')">👨 Men</button>
            <button class="option-btn" onclick="selectOption(2, 'both')">👫 Both</button>
        </div>
    </div>
    
    <!-- QUESTION 3: LOCATION -->
    <div id="question3" style="display:none;">
        <h1>Where are you located?</h1>
        <p class="sub">We'll find matches near you</p>
        <div class="options">
            <button class="option-btn" onclick="selectOption(3, 'us')">🇺🇸 United States</button>
            <button class="option-btn" onclick="selectOption(3, 'uk')">🇮🇩 Indonesia</button>
            <button class="option-btn" onclick="selectOption(3, 'ca')">🇨🇦 Canada</button>
            <button class="option-btn" onclick="selectOption(3, 'au')">🇦🇺 Australia</button>
        </div>
    </div>
    
    <!-- NEXT BUTTON -->
    <button class="next-btn" id="nextBtn" onclick="nextStep()">Continue →</button>
    
    <!-- TRUST -->
    <div class="trust">
        🔒 Your data is <span>100% secure</span> and anonymous
    </div>
</div>

<script>
    // ============================================================
    // 🔥 KONFIGURASI 🔥
    // ============================================================
    const MAIN_LP_URL = "main-lander.html"; // Ganti ke main LP lu
    const CPA_OFFER_URL = "https://your-cpa-offer-link.com/click"; // Fallback
    
    // ============================================================
    // 🎯 LOGIKA PRE-LANDER
    // ============================================================
    let currentStep = 1;
    let answers = {};
    const totalSteps = 3;
    
    function selectOption(step, value) {
        // Highlight selected
        const parent = document.getElementById('question' + step);
        const buttons = parent.querySelectorAll('.option-btn');
        buttons.forEach(btn => btn.classList.remove('selected'));
        event.target.classList.add('selected');
        
        // Simpan jawaban
        answers['step' + step] = value;
        
        // Auto-advance setelah 300ms
        setTimeout(() => {
            if (step < totalSteps) {
                goToStep(step + 1);
            } else {
                finishPreLander();
            }
        }, 300);
    }
    
    function goToStep(step) {
        // Sembunyikan semua
        for (let i = 1; i <= totalSteps; i++) {
            document.getElementById('question' + i).style.display = 'none';
        }
        
        // Tampilkan step saat ini
        document.getElementById('question' + step).style.display = 'block';
        currentStep = step;
        
        // Update progress
        const progress = (step / totalSteps) * 100;
        document.getElementById('progressFill').style.width = progress + '%';
        document.getElementById('stepLabel').textContent = `Step ${step} of ${totalSteps}`;
        
        // Sembunyikan next button (auto-advance)
        document.getElementById('nextBtn').classList.remove('show');
    }
    
    function nextStep() {
        if (currentStep < totalSteps) {
            goToStep(currentStep + 1);
        } else {
            finishPreLander();
        }
    }
    
    function finishPreLander() {
        // Cek jawaban (kalo di bawah 18, redirect ke Google)
        if (answers.step1 === 'no') {
            window.location.href = 'https://www.google.com';
            return;
        }
        
        // Simpan jawaban di sessionStorage
        sessionStorage.setItem('prelander_answers', JSON.stringify(answers));
        
        // Redirect ke main LP
        window.location.href = MAIN_LP_URL;
    }
    
    console.log('🔥 Pre-Lander Active');
</script>

</body>
</html>
